<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe8ee"/>
      <stop offset="55%" stop-color="#eae4d6"/>
      <stop offset="100%" stop-color="#f2ead8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bcd4dd" stop-opacity=".95"/>
      <stop offset="50%" stop-color="#e8f1f4" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#a9c4d0" stop-opacity=".95"/>
    </linearGradient>
    <pattern id="brick" width="26" height="14" patternUnits="userSpaceOnUse">
      <rect width="26" height="14" fill="#d9cbb2"/>
      <rect width="26" height="1.6" y="12.4" fill="#c9b899"/>
      <rect width="1.4" height="7" x="13" fill="#c9b899"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#sky)"/>

  <!-- 远处的楼群 -->
  <g opacity=".38">
    <rect x="40" y="150" width="130" height="330" fill="#c9c2b0"/>
    <rect x="190" y="205" width="95" height="275" fill="#bfb8a6"/>
    <rect x="900" y="175" width="120" height="305" fill="#c9c2b0"/>
    <rect x="1040" y="230" width="110" height="250" fill="#bfb8a6"/>
    <g fill="#e7e0d0">
      <rect x="58" y="176" width="20" height="24"/><rect x="92" y="176" width="20" height="24"/><rect x="126" y="176" width="20" height="24"/>
      <rect x="58" y="222" width="20" height="24"/><rect x="92" y="222" width="20" height="24"/><rect x="126" y="222" width="20" height="24"/>
      <rect x="58" y="268" width="20" height="24"/><rect x="92" y="268" width="20" height="24"/><rect x="126" y="268" width="20" height="24"/>
      <rect x="210" y="230" width="18" height="22"/><rect x="242" y="230" width="18" height="22"/>
      <rect x="920" y="200" width="20" height="24"/><rect x="954" y="200" width="20" height="24"/><rect x="988" y="200" width="20" height="24"/>
      <rect x="920" y="248" width="20" height="24"/><rect x="954" y="248" width="20" height="24"/><rect x="988" y="248" width="20" height="24"/>
    </g>
  </g>

  <!-- 目标楼：6 层砖混老楼 -->
  <g>
    <rect x="300" y="110" width="470" height="410" fill="url(#brick)"/>
    <rect x="300" y="110" width="470" height="410" fill="none" stroke="#bfae90" stroke-width="3"/>
    <!-- 楼顶水箱与女儿墙 -->
    <rect x="300" y="98" width="470" height="16" fill="#cbbda4"/>
    <rect x="640" y="66" width="44" height="34" fill="#b9c6cb" stroke="#93a3a9" stroke-width="2"/>
    <rect x="652" y="80" width="20" height="20" fill="#8fa0a6"/>
    <!-- 六层窗：每层 5 户 -->
    <g>
      <!-- 层 1..6，y 起点 132，步长 62 -->
      <g fill="#8fa6b2" stroke="#a9987c" stroke-width="2">
        <!-- floor 6 -->
        <rect x="322" y="134" width="58" height="42"/><rect x="398" y="134" width="58" height="42"/><rect x="474" y="134" width="58" height="42"/><rect x="550" y="134" width="58" height="42"/><rect x="626" y="134" width="58" height="42"/>
        <!-- floor 5 -->
        <rect x="322" y="196" width="58" height="42"/><rect x="398" y="196" width="58" height="42"/><rect x="474" y="196" width="58" height="42"/><rect x="550" y="196" width="58" height="42"/><rect x="626" y="196" width="58" height="42"/>
        <!-- floor 4 -->
        <rect x="322" y="258" width="58" height="42"/><rect x="398" y="258" width="58" height="42"/><rect x="474" y="258" width="58" height="42"/><rect x="550" y="258" width="58" height="42"/><rect x="626" y="258" width="58" height="42"/>
        <!-- floor 3 -->
        <rect x="322" y="320" width="58" height="42"/><rect x="398" y="320" width="58" height="42"/><rect x="474" y="320" width="58" height="42"/><rect x="550" y="320" width="58" height="42"/><rect x="626" y="320" width="58" height="42"/>
        <!-- floor 2 -->
        <rect x="322" y="382" width="58" height="42"/><rect x="398" y="382" width="58" height="42"/><rect x="474" y="382" width="58" height="42"/><rect x="550" y="382" width="58" height="42"/><rect x="626" y="382" width="58" height="42"/>
        <!-- floor 1 -->
        <rect x="322" y="444" width="58" height="42"/><rect x="398" y="444" width="58" height="42"/><rect x="550" y="444" width="58" height="42"/><rect x="626" y="444" width="58" height="42"/>
      </g>
      <!-- 窗框十字 -->
      <g stroke="#cdbfa6" stroke-width="2">
        <path d="M351 134v42M322 155h58M427 134v42M398 155h58M503 134v42M474 155h58M579 134v42M550 155h58M655 134v42M626 155h58"/>
        <path d="M351 196v42M322 217h58M427 196v42M398 217h58M503 196v42M474 217h58M579 196v42M550 217h58M655 196v42M626 217h58"/>
        <path d="M351 258v42M322 279h58M427 258v42M398 279h58M503 258v42M474 279h58M579 258v42M550 279h58M655 258v42M626 279h58"/>
        <path d="M351 320v42M322 341h58M427 320v42M398 341h58M503 320v42M474 341h58M579 320v42M550 341h58M655 320v42M626 341h58"/>
        <path d="M351 382v42M322 403h58M427 382v42M398 403h58M503 382v42M474 403h58M579 382v42M550 403h58M655 382v42M626 403h58"/>
        <path d="M351 444v42M322 465h58M427 444v42M398 465h58M579 444v42M550 465h58M655 444v42M626 465h58"/>
      </g>
      <!-- 一层入户门洞 -->
      <rect x="474" y="444" width="58" height="76" fill="#7d6b52"/>
      <rect x="482" y="452" width="42" height="68" fill="#5f5140"/>
      <circle cx="516" cy="490" r="3" fill="#d9c37a"/>
    </g>
    <!-- 空调外机 -->
    <g fill="#cfd6d6" stroke="#a8b3b3" stroke-width="2">
      <rect x="628" y="300" width="34" height="24"/><rect x="326" y="424" width="34" height="24"/>
    </g>
    <!-- 一层小院与雨棚 -->
    <rect x="300" y="500" width="470" height="20" fill="#b7a88d"/>
  </g>

  <!-- 新加装的电梯井：玻璃 + 钢架 -->
  <g>
    <rect x="770" y="150" width="118" height="370" fill="url(#glass)" stroke="#7f9aa5" stroke-width="3"/>
    <g stroke="#8fa6ae" stroke-width="3">
      <path d="M770 210h118M770 270h118M770 330h118M770 390h118M770 450h118"/>
    </g>
    <!-- 连廊，接每层楼道 -->
    <g fill="#c9d5da" stroke="#7f9aa5" stroke-width="3">
      <rect x="740" y="160" width="34" height="34"/>
      <rect x="740" y="222" width="34" height="34"/>
      <rect x="740" y="284" width="34" height="34"/>
      <rect x="740" y="346" width="34" height="34"/>
      <rect x="740" y="408" width="34" height="34"/>
      <rect x="740" y="470" width="34" height="34"/>
    </g>
    <!-- 轿厢 -->
    <rect x="792" y="330" width="74" height="58" fill="#dbe7ec" stroke="#5f7b86" stroke-width="3"/>
    <path d="M829 330v-80" stroke="#5f7b86" stroke-width="2" stroke-dasharray="6 5"/>
    <!-- 顶部机房 -->
    <rect x="770" y="120" width="118" height="30" fill="#cfc4ad" stroke="#a9987c" stroke-width="3"/>
    <!-- 施工脚手架残影 -->
    <g stroke="#c9a45c" stroke-width="4" opacity=".55">
      <path d="M756 520h150M756 150v370M900 150v370"/>
    </g>
  </g>

  <!-- 地面、绿化、停车 -->
  <rect x="0" y="520" width="1200" height="80" fill="#cfc4ab"/>
  <rect x="0" y="520" width="1200" height="7" fill="#b9ab8f"/>
  <g fill="#8fa974">
    <circle cx="170" cy="470" r="46"/><circle cx="205" cy="486" r="34"/><circle cx="215" cy="452" r="30"/>
    <rect x="166" y="500" width="9" height="42" fill="#8a7a5c"/>
  </g>
  <g fill="#8fa974" opacity=".85">
    <circle cx="985" cy="492" r="30"/><circle cx="1012" cy="504" r="22"/>
    <rect x="981" y="512" width="7" height="30" fill="#8a7a5c"/>
  </g>
  <!-- 自行车与电动车剪影 -->
  <g stroke="#6f6350" stroke-width="4" fill="none" opacity=".8">
    <circle cx="620" cy="556" r="14"/><circle cx="660" cy="556" r="14"/>
    <path d="M620 556l18-24h20l12 24M638 532h16"/>
    <rect x="700" y="536" width="46" height="20" rx="4"/>
    <circle cx="706" cy="560" r="9"/><circle cx="740" cy="560" r="9"/>
  </g>

  <!-- 楼体标识：单元号 -->
  <rect x="556" y="470" width="52" height="24" fill="#8c1418" opacity=".85"/>
  <text x="582" y="487" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#f2d57e" text-anchor="middle">6 号楼</text>
</svg>
