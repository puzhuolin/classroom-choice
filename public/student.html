<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>共和国抉择 · 学生端</title>
<style>
  :root{--red:#b81c22;--red-deep:#8c1418;--gold:#d4af37;--gold-l:#f2d57e;--ink:#2b2622;--paper:#f6efe0;--paper2:#fffdf7;--green:#1f7a4d;--blue:#1f5fa8;--shadow:0 8px 24px rgba(80,20,20,.14);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0%,rgba(212,175,55,.16),transparent 40%),var(--paper);min-height:100vh;}
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .who{display:flex;align-items:center;gap:10px;}
  .badge-g{font-size:13px;font-weight:800;color:#fff;background:var(--red);padding:6px 12px;border-radius:20px;}
  .badge-g.g2{background:var(--blue);} .badge-g.g3{background:var(--green);} .badge-g.g4{background:#c07a12;}
  .nm{font-size:15px;font-weight:700;color:var(--red-deep);}
  .live{font-size:11px;color:#8a6d3b;display:flex;align-items:center;gap:5px;}
  .dotl{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .card{background:var(--paper2);border-radius:16px;padding:20px;box-shadow:var(--shadow);}
  .hero{text-align:center;padding:26px 20px;}
  .hero .ttl{font-size:22px;font-weight:800;color:var(--red-deep);letter-spacing:1px;margin-bottom:6px;}
  .hero .desc{font-size:13px;color:#8a6d3b;line-height:1.7;}
  .field{margin:18px 0 10px;}
  input{width:100%;padding:14px 16px;border:2px solid #e6d8bb;border-radius:12px;font-size:17px;font-family:inherit;outline:none;text-align:center;}
  input:focus{border-color:var(--red);}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-size:16px;font-weight:700;padding:14px 18px;transition:.15s;width:100%;}
  .b-red{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(184,28,34,.3);}
  .b-red:active{transform:scale(.98);}
  .stage-tag{font-size:13px;color:#a07b22;margin-bottom:6px;}
  .q{font-size:19px;font-weight:800;color:var(--red-deep);line-height:1.55;margin-bottom:16px;}
  .opts{display:grid;gap:12px;}
  .opt{position:relative;background:#fff;border:2px solid #e6d8bb;border-radius:14px;padding:16px;text-align:left;font-size:15.5px;line-height:1.5;overflow:hidden;transition:.15s;width:100%;color:var(--ink);}
  .opt .mk{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#efe4cd;color:#8a6d3b;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-right:10px;vertical-align:middle;}
  .opt.sel{border-color:var(--red);background:#fff4f4;}
  .opt.sel .mk{background:var(--red);color:#fff;}
  .opt .pct{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:var(--red);}
  .opt .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(184,28,34,.12);width:0;transition:width .5s;}
  .opt .rl{position:relative;padding-right:42px;}
  .waiting{text-align:center;padding:26px 10px;color:#8a6d3b;}
  .waiting .big{font-size:40px;margin-bottom:10px;}
  .waiting p{font-size:14.5px;line-height:1.8;}
  .done-msg{text-align:center;padding:24px;}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top" style="display:none;">
    <div class="who"><span class="badge-g" id="gBadge">第1组</span><span class="nm" id="uName">同学</span></div>
    <div class="live"><span class="dotl"></span>实时</div>
  </div>

  <div class="card hero" id="joinView">
    <div class="ttl">共 和 国 抉 择</div>
    <div class="desc">你，是 1949 年新中国的领导人。<br>输入名字，随机进入一个小组，一起做抉择。</div>
    <div class="field"><input id="nameInput" maxlength="12" placeholder="输入你的名字" autocomplete="off"></div>
    <button class="b-red" onclick="join()">进 入 课 堂</button>
  </div>

  <div class="card" id="playView" style="display:none;">
    <div id="viewBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SID_KEY = "cls_sid";
let sid = localStorage.getItem(SID_KEY) || null;
let joined = false;
let lastState = null;
let ticking = false;

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

async function join(){
  const inp = document.getElementById("nameInput");
  const name = (inp.value||"").trim();
  if(!name){ inp.style.borderColor="#b81c22"; inp.focus(); return; }
  try{
    const r = await fetch("/api/join", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name})});
    const d = await r.json();
    if(d.ok){
      sid = d.id; localStorage.setItem(SID_KEY, sid);
      joined = true;
      document.getElementById("joinView").style.display="none";
      document.getElementById("playView").style.display="block";
      document.getElementById("top").style.display="flex";
      poll();
    }else{ toast(d.error || "加入失败，请重试"); }
  }catch(e){ toast("网络异常，请重试"); }
}

async function answer(choice){
  if(!sid) return;
  try{
    const r = await fetch("/api/answer", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({id:sid, choice})});
    const d = await r.json();
    if(d.ok){ toast("已提交，可修改"); poll(); }
    else if(d.error==="closed"){ toast("本轮投票已结束"); }
  }catch(e){ toast("提交失败，请重试"); }
}

function renderMe(d){
  if(!d.ok){ 
    // 身份失效（服务器重启等）
    localStorage.removeItem(SID_KEY); sid=null; joined=false;
    document.getElementById("top").style.display="none";
    document.getElementById("playView").style.display="none";
    document.getElementById("joinView").style.display="block";
    return;
  }
  document.getElementById("gBadge").textContent = d.groupName;
  const gi = d.group+1;
  document.getElementById("gBadge").className = "badge-g" + (gi>1?(" g"+gi):"");
  document.getElementById("uName").textContent = d.name;

  const body = document.getElementById("viewBody");
  const phase = d.phase, si = d.stageIndex;

  if(phase === "idle"){
    body.innerHTML = '<div class="waiting"><div class="big">⏳</div><p>已进入课堂，你被分到 <b>'+d.groupName+'</b>。<br>等待老师开始第一个环节…</p></div>';
    return;
  }
  if(phase === "done"){
    body.innerHTML = '<div class="done-msg"><div style="font-size:44px">🎉</div><p style="font-size:16px;line-height:1.8;color:#5b4a2a;margin-top:8px">课堂已结束，谢谢参与！<br>看看大屏上的小组排名吧。</p></div>';
    return;
  }
  if(phase === "open" && d.stage){
    let html = '<div class="stage-tag">第 '+(si+1)+' 环节 / '+d.totalStages+' · '+esc(d.stage.title)+'</div>';
    html += '<div class="q">'+esc(d.stage.q)+'</div><div class="opts">';
    d.stage.options.forEach((o,i)=>{
      const sel = d.myChoice === i;
      html += '<button class="opt'+(sel?' sel':'')+'" onclick="answer('+i+')">'+
        '<span class="mk">'+["A","B","C"][i]+'</span>'+esc(o.label)+'</button>';
    });
    html += '</div>';
    if(d.myChoice != null) html += '<div style="text-align:center;margin-top:14px;font-size:13px;color:var(--green);font-weight:700">✅ 已提交，可点击其他选项修改</div>';
    body.innerHTML = html;
    return;
  }
  if(phase === "closed" && d.stage){
    // 显示结果分布
    const total = (d.counts||[]).reduce((a,b)=>a+b,0) || 1;
    let html = '<div class="stage-tag">本轮结果（第 '+(si+1)+' 环节）</div>';
    html += '<div class="q" style="font-size:16px;">'+esc(d.stage.q)+'</div><div class="opts">';
    d.stage.options.forEach((o,i)=>{
      const c = (d.counts||[])[i]||0;
      const pct = Math.round(c/total*100);
      const sel = d.myChoice === i;
      html += '<div class="opt'+(sel?' sel':'')+'" style="pointer-events:none;">'+
        '<div class="bar" style="width:'+pct+'%"></div>'+
        '<div class="rl"><span class="mk">'+["A","B","C"][i]+'</span>'+esc(o.label)+'</div>'+
        '<span class="pct">'+pct+'%</span></div>';
    });
    html += '</div><div style="text-align:center;margin-top:14px;font-size:13px;color:#8a6d3b">本轮已结束，等待老师进入下一环节…</div>';
    body.innerHTML = html;
    return;
  }
  body.innerHTML = '<div class="waiting"><div class="big">⏳</div><p>等待老师操作…</p></div>';
}

async function poll(){
  if(!sid || ticking) return;
  ticking = true;
  try{
    const r = await fetch("/api/me?id=" + encodeURIComponent(sid));
    const d = await r.json();
    renderMe(d);
    if(d.ok && !joined){ joined = true; document.getElementById("joinView").style.display="none"; document.getElementById("playView").style.display="block"; document.getElementById("top").style.display="flex"; }
  }catch(e){}
  ticking = false;
}

// 已保存身份则直接进入
if(sid){
  document.getElementById("joinView").style.display="none";
  document.getElementById("playView").style.display="block";
  document.getElementById("top").style.display="flex";
  poll();
}
setInterval(poll, 1200);

// 回车提交名字
document.getElementById("nameInput").addEventListener("keydown", function(e){ if(e.key==="Enter") join(); });
</script>
</body>
</html>
