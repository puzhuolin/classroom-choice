<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师控制台 · 共和国抉择课堂版</title>
<style>
  :root{--red:#b81c22;--red-deep:#8c1418;--gold:#d4af37;--gold-l:#f2d57e;--ink:#2b2622;--paper:#f6efe0;--paper2:#fffdf7;--green:#1f7a4d;--blue:#1f5fa8;--shadow:0 8px 24px rgba(80,20,20,.14);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 8%,rgba(212,175,55,.14),transparent 40%),radial-gradient(circle at 92% 92%,rgba(184,28,34,.1),transparent 44%),var(--paper);min-height:100vh;}
  .wrap{max-width:1240px;margin:0 auto;padding:18px 16px 40px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .seal{width:46px;height:46px;border-radius:11px;background:linear-gradient(135deg,var(--red),var(--red-deep));color:var(--gold-l);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;text-align:center;line-height:1.05;border:2px solid var(--gold);transform:rotate(-4deg);}
  .brand h1{font-size:20px;color:var(--red-deep);}
  .brand .sub{font-size:12px;color:#8a6d3b;}
  .phase{display:flex;align-items:center;gap:10px;}
  .badge{font-size:13px;font-weight:700;color:#fff;padding:6px 14px;border-radius:20px;background:#999;}
  .badge.idle{background:#8a8a8a;} .badge.open{background:var(--green);} .badge.closed{background:#c07a12;} .badge.done{background:var(--blue);}
  .ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--paper2);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:16px;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:14px;font-weight:700;padding:10px 16px;transition:.15s;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .b-red{background:var(--red);color:#fff;} .b-red:hover:not(:disabled){background:var(--red-deep);}
  .b-green{background:var(--green);color:#fff;} .b-green:hover:not(:disabled){background:#176040;}
  .b-blue{background:var(--blue);color:#fff;} .b-blue:hover:not(:disabled){background:#174a85;}
  .b-gold{background:var(--gold);color:#3a2c08;} .b-gold:hover:not(:disabled){filter:brightness(1.05);}
  .b-ghost{background:#fff;color:var(--red);border:2px solid var(--red);}
  .spacer{flex:1;}

  .main{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;}
  .card{background:var(--paper2);border-radius:16px;padding:20px;box-shadow:var(--shadow);}
  .card + .card{margin-top:16px;}
  .stage-title{font-size:14px;color:#a07b22;margin-bottom:6px;}
  .q{font-size:22px;font-weight:800;color:var(--red-deep);line-height:1.5;margin-bottom:16px;}
  .opts{display:grid;gap:10px;}
  .opt{background:#fff;border:2px solid #e6d8bb;border-radius:12px;padding:12px 14px;position:relative;overflow:hidden;}
  .opt .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(212,175,55,.35),rgba(184,28,34,.22));width:0;transition:width .5s;}
  .opt .row{position:relative;display:flex;align-items:center;gap:10px;}
  .opt .mk{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .opt .lbl{flex:1;font-size:15px;line-height:1.4;}
  .opt .num{font-weight:800;font-size:18px;color:var(--red);min-width:44px;text-align:right;}
  .meta{font-size:13px;color:#8a6d3b;margin-top:12px;}

  .groups{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .gcard{background:var(--paper2);border-radius:14px;padding:14px;box-shadow:var(--shadow);border-top:5px solid var(--red);}
  .gcard.g2{border-top-color:var(--blue);} .gcard.g3{border-top-color:var(--green);} .gcard.g4{border-top-color:#c07a12;}
  .ghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .ghead .nm{font-weight:800;font-size:16px;color:var(--red-deep);}
  .ghead .pw{font-size:12px;color:#8a6d3b;}
  .gcount{font-size:12px;color:#a08a66;margin-bottom:8px;}
  .members{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .tag{font-size:12.5px;padding:4px 9px;border-radius:20px;background:#f0e7d2;color:#6b5b46;display:inline-flex;align-items:center;gap:5px;}
  .tag.ok{background:#e6f7ee;color:var(--green);}
  .tag .dot{width:7px;height:7px;border-radius:50%;background:#c9b98f;}
  .tag.ok .dot{background:var(--green);}
  .gtally{display:grid;gap:5px;}
  .gtally .tl{display:flex;align-items:center;gap:6px;font-size:12px;color:#6b5b46;}
  .gtally .tb{flex:1;height:8px;background:#ece0c6;border-radius:5px;overflow:hidden;}
  .gtally .tb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .4s;}
  .gtally .tn{min-width:26px;text-align:right;font-weight:700;color:var(--red);}

  .side .card{position:sticky;top:16px;}
  .qrbox{text-align:center;}
  .qrbox img{width:210px;height:210px;background:#fff;border-radius:12px;box-shadow:var(--shadow);}
  .qrurl{font-size:11.5px;color:#8a6d3b;word-break:break-all;margin-top:10px;line-height:1.5;}
  .hint{font-size:12px;color:#a08a66;line-height:1.6;margin-top:8px;}

  .ranking{margin-top:6px;}
  .rk-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#faf5e8;border:2px solid #eee0c2;margin-bottom:8px;}
  .rk-row.top{border-color:var(--gold);background:#fff8e6;}
  .rk-row .medal{font-size:22px;width:30px;text-align:center;}
  .rk-row .nm{font-weight:800;font-size:16px;color:var(--red-deep);min-width:64px;}
  .rk-row .detail{flex:1;font-size:12.5px;color:#8a7a5e;}
  .rk-row .pw{font-weight:800;font-size:20px;color:var(--red);}

  /* 国力增长分析 */
  .analysis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .acard{background:#fff;border-radius:14px;padding:14px;border:2px solid #eee0c2;border-top:5px solid var(--red);}
  .acard.g2{border-top-color:var(--blue);} .acard.g3{border-top-color:var(--green);} .acard.g4{border-top-color:#c07a12;}
  .acard .ah{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;}
  .acard .an{font-weight:800;font-size:15px;color:var(--red-deep);}
  .acard .ap{font-weight:800;font-size:22px;color:var(--red);}
  .acard .ag{font-size:11.5px;margin-bottom:10px;color:var(--green);font-weight:700;}
  .acard .ag.neg{color:#8a8a8a;}
  .arow{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px;color:#5b4b33;}
  .arow .rl2{width:42px;flex-shrink:0;}
  .arow .tb2{flex:1;height:9px;background:#ece0c6;border-radius:5px;overflow:hidden;}
  .arow .tb2 i{display:block;height:100%;border-radius:5px;transition:width .5s;}
  .arow .ve{width:30px;text-align:right;font-weight:700;color:#2b2622;}
  .arow .de{width:36px;text-align:right;font-weight:700;font-size:11px;}
  .de.pos{color:var(--green);} .de.neg{color:var(--red);} .de.zero{color:#a08a66;}
  .cstack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 8px;background:#f0e7d2;}
  .cstack i{display:block;height:100%;}
  .amain{font-size:12px;font-weight:800;color:var(--red-deep);background:#fff7e6;border:1px dashed var(--gold);border-radius:8px;padding:6px 8px;text-align:center;}
  .amain.none{color:#8a8a8a;border-color:#ddd;background:#f7f4ec;}
  .crown{display:inline-block;margin-bottom:8px;font-size:10.5px;font-weight:800;color:#fff;background:var(--red);border-radius:20px;padding:2px 9px;}

  /* 四对关系分析（民主课） */
  .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px dashed #efe4cb;}
  .prow:last-of-type{border-bottom:none;}
  .prow .pl2{color:#5b4b33;}
  .prow .pv{font-weight:800;white-space:nowrap;}
  .pv.ok{color:var(--green);} .pv.bad{color:var(--red);} .pv.none{color:#b3a68d;font-weight:600;}
  .opt-ok{border-color:var(--green)!important;background:#f2fbf6!important;}
  .opt-ok .mk{background:var(--green)!important;}
  .okflag{position:relative;font-size:11.5px;font-weight:800;color:var(--green);background:#e6f7ee;border-radius:20px;padding:2px 9px;white-space:nowrap;}
  .tipbox{margin-top:10px;background:#fff7e6;border:1px dashed var(--gold);border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.75;color:#5c4a20;}
  .tipbox b{color:var(--red-deep);}
  .selwrap{display:flex;align-items:center;gap:7px;background:#fff7e6;border:2px solid var(--gold);border-radius:10px;padding:4px 10px 4px 12px;font-size:13px;font-weight:700;color:#7a5c10;}
  .selwrap select{font-family:inherit;font-size:13px;font-weight:700;color:var(--red-deep);background:transparent;border:none;outline:none;cursor:pointer;padding:4px 2px;}
  .media{width:100%;max-height:38vh;object-fit:contain;border-radius:12px;display:block;margin-bottom:12px;background:#f4eee0;border:1px solid #e6dcc8;}
  .mediacap{font-size:12.5px;color:#8a7b63;margin:-6px 0 12px;}
  @media(max-width:900px){.main{grid-template-columns:1fr;} .groups{grid-template-columns:1fr;} .side .card{position:static;}}
  @media(max-width:560px){.analysis{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="seal">课堂<br>控制</div>
      <div><h1 id="appTitle">课堂控制台</h1><div class="sub" id="appSub">实时看选择 · 控环节节奏 · 分组比拼</div></div>
    </div>
    <div class="phase">
      <span class="badge idle" id="phaseBadge">未开始</span>
      <span class="badge" id="stageBadge" style="background:#8a6d3b">— / 6</span>
    </div>
  </header>

  <div class="ctrl">
    <label class="selwrap">情景
      <select id="gameSel" onchange="switchGame(this.value)"></select>
    </label>
    <button class="b-red" onclick="ctl('start')">▶ 开始上课</button>
    <button class="b-green" onclick="ctl('open')">开放投票</button>
    <button class="b-gold" onclick="ctl('close')">结束本轮投票</button>
    <button class="b-blue" onclick="ctl('next')">下一环节 ▶</button>
    <button class="b-ghost" onclick="ctl('prev')">◀ 上一环节</button>
    <div class="spacer"></div>
    <button class="b-blue" onclick="ctl('finish')">🏁 结束课堂</button>
    <button class="b-ghost" onclick="if(confirm('重新开始将清空所有学生与作答，确定？'))ctl('restart')">↻ 重新开始</button>
  </div>

  <div class="main">
    <div>
      <div class="card" id="stageCard">
        <div class="stage-title" id="stageTitle">等待开始…</div>
        <div id="mediaBox"></div>
        <div class="q" id="qText">点击「开始上课」进入第一个环节</div>
        <div class="opts" id="opts"></div>
        <div class="meta" id="metaText"></div>
      </div>

      <div class="card" id="rankCard" style="display:none;">
        <div class="q" style="font-size:19px;margin-bottom:12px;">🏆 小组排名（按综合国力）</div>
        <div class="ranking" id="ranking"></div>
      </div>

      <div class="card" id="analysisCard">
        <div class="q" style="font-size:19px;margin-bottom:6px;" id="anaTitle">📊 各组对比分析</div>
        <div style="font-size:12.5px;color:#8a6d3b;margin-bottom:14px;line-height:1.6;" id="anaDesc"></div>
        <div class="analysis" id="analysis"></div>
      </div>

      <div class="card">
        <div style="font-size:14px;color:#a07b22;margin-bottom:10px;">各组实时状态</div>
        <div class="groups" id="groups"></div>
      </div>
    </div>

    <div class="side">
      <div class="card qrbox">
        <div style="font-weight:800;color:var(--red-deep);margin-bottom:8px;">📱 学生扫码进入</div>
        <img id="qr" alt="课堂二维码">
        <div class="qrurl" id="qrurl"></div>
        <div class="hint">学生用微信/相机扫码 → 输入名字 → 自动随机分到 4 组</div>
      </div>
    </div>
  </div>
</div>

<script>
let last = null;
let SCENARIOS = [];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* 媒体：只在地址变化时重绘，避免每秒轮询把视频打回开头 */
let _mediaUrl = null;
function mediaHtml(m){
  const url = String(m.url || "");
  const isVid = /\.(mp4|webm|ogg|mov)(\?|$)/i.test(url);
  const cap = m.caption ? '<div class="mediacap">' + esc(m.caption) + '</div>' : "";
  return isVid
    ? '<video class="media" src="' + esc(url) + '" controls playsinline preload="metadata"></video>' + cap
    : '<img class="media" src="' + esc(url) + '" alt="">' + cap;
}
function setMedia(m){
  const url = (m && m.url) ? String(m.url) : "";
  if(url === _mediaUrl) return;
  _mediaUrl = url;
  const box = document.getElementById("mediaBox");
  if(box) box.innerHTML = url ? mediaHtml(m) : "";
}
const PHASE = {idle:"未开始", open:"投票中", closed:"本轮已结束", done:"课堂已结束"};

/* 情景列表（新增情景后这里会自动多一项） */
async function loadScenarios(){
  try{
    const r = await fetch("/api/scenarios");
    const d = await r.json();
    SCENARIOS = d.scenarios || [];
    const sel = document.getElementById("gameSel");
    const cur = sel.value;
    sel.innerHTML = SCENARIOS.map(function(s){
      return '<option value="' + esc(s.id) + '">' + esc((s.emoji||"") + " " + s.title) + '</option>';
    }).join("");
    const want = new URLSearchParams(location.search).get("s") || cur;
    if(want && SCENARIOS.some(x => x.id === want)) sel.value = want;
  }catch(e){}
}

/* 从大厅点「课堂用」进来时，自动把该情景设为当前情景 */
async function applyScenarioFromUrl(){
  const want = new URLSearchParams(location.search).get("s");
  if(!want) return;
  try{
    await fetch("/api/control", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"setScenario", id:want, keepStudents:true})});
  }catch(e){}
}

// QR
(function(){
  const studentUrl = location.origin + "/s";
  document.getElementById("qrurl").textContent = studentUrl;
  const a = encodeURIComponent(studentUrl);
  const img = document.getElementById("qr");
  img.src = "https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=8&data=" + a;
  img.onerror = function(){ this.onerror=null; this.src = "https://quickchart.io/qr?size=260&text=" + a; };
})();

async function ctl(action){
  try{
    await fetch("/api/control", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({action})});
    poll();
  }catch(e){}
}

async function switchGame(id){
  const s = SCENARIOS.find(x => x.id === id);
  const nm = s ? (s.emoji + " " + s.title) : id;
  if(!confirm("切换到《" + nm + "》？\n已加入的学生会保留，但本轮所有作答会被清空，需要重新「开始上课」。")){
    const sel = document.getElementById("gameSel");
    if(last && last.game) sel.value = last.game.key;
    return;
  }
  try{
    await fetch("/api/control", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"setScenario", id, keepStudents:true})});
    poll();
  }catch(e){ toast("切换失败，请检查网络"); }
}

function toast(msg){
  let t = document.getElementById("_toast");
  if(!t){
    t = document.createElement("div");
    t.id = "_toast";
    t.style.cssText = "position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2b2622;color:#fff;padding:10px 20px;border-radius:22px;font-size:14px;z-index:99;opacity:0;transition:.3s;pointer-events:none";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = 1;
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.style.opacity = 0; }, 1800);
}

async function poll(){
  try{
    const r = await fetch("/api/state");
    const d = await r.json();
    render(d);
  }catch(e){ }
}

function render(d){
  last = d;
  const b = document.getElementById("phaseBadge");
  b.textContent = PHASE[d.phase] || d.phase;
  b.className = "badge " + d.phase;
  document.getElementById("stageBadge").textContent = (d.stageIndex >= 0 ? (d.stageIndex+1) : "—") + " / " + d.totalStages;

  // 课程信息
  if(d.game){
    document.getElementById("appTitle").textContent = d.game.name + " · 教师控制台";
    document.getElementById("appSub").textContent = d.game.subtitle + " ｜ 实时看选择 · 控环节节奏 · 分组比拼";
    const sel = document.getElementById("gameSel");
    if(sel.value !== d.game.key) sel.value = d.game.key;
  }
  const isJudge = !!(d.game && d.game.type === "judge");
  document.getElementById("anaTitle").textContent = isJudge ? "🎯 选择与关系实时对比（各组）" : "📊 国力增长分析（各组对比）";
  document.getElementById("anaDesc").textContent = isJudge
    ? "每组按「组内多数选择」计。看每组答对几题、哪一组关系没立住、偏向了哪一侧——那就是他们要补的那一课。"
    : "综合国力 = 各维度的平均值。看每组增长主要来自哪一项，就知道这一组把力气押在了哪里（随作答实时更新）。";

  // stage
  setMedia(d.stage ? d.stage.media : (d.game && d.game.cover));
  if(d.stage){
    document.getElementById("stageTitle").textContent = d.stage.title + " · 第 " + (d.stageIndex+1) + " 环节";
    document.getElementById("qText").textContent = d.stage.q;
  }else{
    document.getElementById("stageTitle").textContent = "等待开始…";
    document.getElementById("qText").textContent = d.phase === "done" ? "课堂已结束，见下方小组排名" : "点击「开始上课」进入第一个环节";
  }

  // options
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  let tipHtml = "";
  if(d.stage){
    const total = Math.max(1, d.totalStudents);
    const letters = ["A","B","C"];
    d.stage.options.forEach((o,i)=>{
      const c = d.counts[i] || 0;
      const pct = Math.round(c/total*100);
      const revealed = (o.ok !== undefined && o.ok !== null);
      const el = document.createElement("div");
      el.className = "opt" + (revealed && o.ok ? " opt-ok" : "");
      el.innerHTML = '<div class="bar" style="width:'+pct+'%"></div>'+
        '<div class="row"><span class="mk">'+letters[i]+'</span><span class="lbl">'+esc(o.label)+'</span>'+
        (revealed && o.ok ? '<span class="okflag">✅ 正确解</span>' : '')+
        '<span class="num">'+c+' 票</span></div>';
      opts.appendChild(el);
      if(revealed && o.ok && o.tip) tipHtml = '<b>讲评：</b>' + o.tip;
    });
    if(tipHtml){
      const oldT = document.getElementById("tipbox"); if(oldT) oldT.remove();
      opts.insertAdjacentHTML("afterend", '<div class="tipbox" id="tipbox">'+tipHtml+'</div>');
    }else{ const old = document.getElementById("tipbox"); if(old) old.remove(); }
    document.getElementById("metaText").textContent = "已作答 " + d.answeredCount + " / " + d.totalStudents + " 人" +
      (d.phase === "closed" ? "　·　本轮已结束，可对照正确答案讲评" : "");
  }else{
    const old = document.getElementById("tipbox"); if(old) old.remove();
    document.getElementById("metaText").textContent = d.totalStudents > 0 ? ("当前共 " + d.totalStudents + " 名学生已加入") : "";
  }

  // groups
  const gwrap = document.getElementById("groups"); gwrap.innerHTML = "";
  d.groups.forEach((g,idx)=>{
    const card = document.createElement("div");
    card.className = "gcard g"+(idx+1);
    let membersHtml = g.members.length ? g.members.map(m=>{
      const ch = m.choice!=null ? " · "+["A","B","C"][m.choice] : "";
      return '<span class="tag '+(m.answered?'ok':'')+'"><span class="dot"></span>'+esc(m.name)+ch+'</span>';
    }).join("") : '<span style="font-size:12px;color:#a08a66">暂无成员</span>';
    let tallyHtml = "";
    if(d.stage){
      d.stage.options.forEach((o,i)=>{
        const c = g.counts[i]||0;
        const pct = Math.round(c/Math.max(1,g.members.length)*100);
        tallyHtml += '<div class="tl"><span>'+["A","B","C"][i]+'</span><div class="tb"><i style="width:'+pct+'%"></i></div><span class="tn">'+c+'</span></div>';
      });
    }
    const headRight = isJudge ? ("得分 " + g.score + "/" + d.totalStages) : ("综合国力 " + g.power);
    const pairCnt = (d.pairsDef || []).length;
    card.innerHTML = '<div class="ghead"><span class="nm">'+esc(g.name)+'</span><span class="pw">'+headRight+'</span></div>'+
      '<div class="gcount">成员 '+g.members.length+' 人'+(isJudge && pairCnt ? '　·　关系立住 '+g.unified+'/'+pairCnt : '')+'</div>'+
      '<div class="members">'+membersHtml+'</div>'+
      '<div class="gtally">'+tallyHtml+'</div>';
    gwrap.appendChild(card);
  });

  // ranking
  const rc = document.getElementById("rankCard");
  if(d.ranking){
    rc.style.display = "block";
    const rk = document.getElementById("ranking"); rk.innerHTML = "";
    const medals = ["🥇","🥈","🥉","4"];
    const pairCnt2 = (d.pairsDef || []).length;
    d.ranking.forEach((r,i)=>{
      const row = document.createElement("div");
      row.className = "rk-row"+(i<3?" top":"");
      let detail;
      if(isJudge){
        detail = (pairCnt2 ? ("关系立住 " + r.unified + "/" + pairCnt2 + " ｜ ") : "") + r.em + " " + esc(r.tag);
      } else {
        detail = (d.dimsDef || []).map(function(x){ return esc(x.name) + " " + (r.stats ? r.stats[x.key] : "-"); }).join(" · ") + " ｜ " + r.em + " " + esc(r.tag);
      }
      const big = isJudge ? (r.score + "/" + d.totalStages) : r.power;
      row.innerHTML = '<div class="medal">'+medals[i]+'</div><div class="nm">'+esc(r.name)+'</div>'+
        '<div class="detail">'+detail+'</div>'+
        '<div class="pw">'+big+'</div>';
      rk.appendChild(row);
    });
  }else{ rc.style.display = "none"; }

  renderAnalysis(d);
}

function renderAnalysis(d){
  if(d.game && d.game.type === "judge") renderAnalysisPairs(d);
  else renderAnalysisAttrs(d);
}

/* ---------- 判断型：答对/关系 ---------- */
function renderAnalysisPairs(d){
  const wrap = document.getElementById("analysis");
  if(!wrap) return;
  wrap.innerHTML = "";
  const ICON = ["①","②","③","④","⑤","⑥"];
  const pairCnt = (d.pairsDef || []).length;
  const scores = (d.groups||[]).map(g => g.score || 0);
  const maxS = scores.length ? Math.max.apply(null, scores) : 0;
  (d.groups||[]).forEach(function(g, idx){
    const el = document.createElement("div");
    el.className = "acard g"+(idx+1);
    let rows = "";
    if(pairCnt){
      (g.pairs||[]).forEach(function(p){
        let cls = "none", txt = "未检验";
        if(p.state === "ok"){ cls = "ok"; txt = "✔ 已统一"; }
        else if(p.state === "bad"){ cls = "bad"; txt = "⚠ 偏「" + p.side + "」"; }
        rows += '<div class="prow"><span class="pl2">' + (ICON[p.i] || (p.i+1)) + " " + esc(p.a) + " ⇄ " + esc(p.b) + '</span>' +
          '<span class="pv ' + cls + '">' + txt + '</span></div>';
      });
    } else {
      (g.flags||[]).forEach(function(f, i){
        let cls = "none", txt = "未作答";
        if(f.ok === true){ cls = "ok"; txt = "✔ 选对"; }
        else if(f.ok === false){ cls = "bad"; txt = "✘" + (f.side ? "偏「" + f.side + "」" : ""); }
        rows += '<div class="prow"><span class="pl2">第 ' + (i+1) + ' 幕</span><span class="pv ' + cls + '">' + txt + '</span></div>';
      });
    }
    const crown = (maxS > 0 && g.score === maxS) ? '<span class="crown">🚀 暂时领先</span>' : '';
    const allRight = g.score === d.totalStages;
    const allUnified = pairCnt && g.unified === pairCnt;
    let mainTxt, mainCls;
    if(allRight && (!pairCnt || allUnified)){ mainTxt = pairCnt ? "✅ 全部立住，一题没错" : "✅ 全部选对"; mainCls = "amain"; }
    else if(g.mainSide){ mainTxt = "🎯 主要偏向「" + esc(g.mainSide) + "」" + (g.mainSideCount > 1 ? "（" + g.mainSideCount + " 处）" : ""); mainCls = "amain none"; }
    else if(g.score === 0 && !(g.flags||[]).some(f => f.ok !== null)){ mainTxt = "➖ 还没有作答"; mainCls = "amain none"; }
    else { mainTxt = "➖ 暂无系统性偏向"; mainCls = "amain none"; }
    const sub = pairCnt ? ("关系立住 " + g.unified + " / " + pairCnt) : ("答对 " + g.score + " / " + d.totalStages);
    el.innerHTML = '<div class="ah"><span class="an">' + esc(g.name) + '</span><span class="ap">' + g.score +
      '<span style="font-size:13px;color:#a08a66">/' + d.totalStages + '</span></span></div>' +
      '<div class="ag' + ((pairCnt ? allUnified : allRight) ? '' : ' neg') + '">' + sub + '</div>' + crown +
      rows + '<div class="' + mainCls + '" style="margin-top:10px">' + mainTxt + '</div>';
    wrap.appendChild(el);
  });
}

/* ---------- 属性型：各维度增长 ---------- */
function renderAnalysisAttrs(d){
  const wrap = document.getElementById("analysis");
  if(!wrap) return;
  wrap.innerHTML = "";
  const DIMS = (d.dimsDef || []).map(function(x){ return { key:x.key, name: x.name, icon: x.icon || "", color: x.color || "#b81c22" }; });
  if(!DIMS.length) return;
  const gs0 = (d.groups||[]).map(function(g){ return g.growth||0; });
  const maxG = gs0.length ? Math.max.apply(null, gs0) : 0;
  (d.groups||[]).forEach(function(g, idx){
    const el = document.createElement("div");
    el.className = "acard g"+(idx+1);
    const dl = g.delta || {};
    const contrib = g.contrib || {};
    const growth = g.growth || 0;
    let rows = "";
    DIMS.forEach(function(x){
      const val = (g.stats && g.stats[x.key]) || 0;
      const de = dl[x.key] || 0;
      const cls = de>0?"pos":(de<0?"neg":"zero");
      const sign = de>0?"+":"";
      rows += '<div class="arow"><span class="rl2">'+esc((x.icon||"") + x.name)+'</span>'+
        '<div class="tb2"><i style="width:'+Math.max(0,Math.min(100,val))+'%;background:'+x.color+'"></i></div>'+
        '<span class="ve">'+val+'</span><span class="de '+cls+'">'+sign+de+'</span></div>';
    });
    const stack = '<div class="cstack">' + DIMS.map(function(x){
      return '<i style="width:'+(contrib[x.key]||0)+'%;background:'+x.color+'"></i>';
    }).join("") + '</div>';
    const gsign = growth>0?"+":"";
    const mainDim = DIMS.find(function(x){ return x.key === g.main; });
    let mainTxt, mainCls;
    if(g.main && growth>0){
      mainTxt = '🎯 增长主要来自 '+esc((mainDim? (mainDim.icon||"")+mainDim.name : g.main))+'（'+(dl[g.main]>0?"+":"")+dl[g.main]+'）';
      mainCls = 'amain';
    }else if(g.main){
      mainTxt = '⚠ 整体未增长，仅 '+esc((mainDim? (mainDim.icon||"")+mainDim.name : g.main))+' 有积累（+' + dl[g.main] + '）';
      mainCls = 'amain none';
    }else{
      mainTxt = '➖ 各项均无正增长';
      mainCls = 'amain none';
    }
    const crown = (maxG>0 && growth===maxG && growth>0) ? '<span class="crown">🚀 增长最快</span>' : '';
    el.innerHTML = '<div class="ah"><span class="an">'+esc(g.name)+'</span><span class="ap">'+g.power+'</span></div>'+
      '<div class="ag'+(growth>0?'':' neg')+'">综合国力 '+g.power+'　较起点 '+gsign+growth+'</div>'+ crown +
      rows + stack + '<div class="'+mainCls+'">'+mainTxt+'</div>';
    wrap.appendChild(el);
  });
}

/* ---------- 初始化 ---------- */
(async function(){
  await applyScenarioFromUrl();
  await loadScenarios();
  poll();
  setInterval(poll, 1000);
})();
